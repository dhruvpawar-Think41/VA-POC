[project]
name = "voice-poc"
version = "0.1.0"
description = "Real-time voice AI assistant POC using Pipecat + Gemini Live API"
requires-python = ">=3.11"
dependencies = [
    "pipecat-ai[google,webrtc,silero]>=0.0.72,<1.0.0",
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.32.0,<1.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
